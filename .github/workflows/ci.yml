name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test (CI + Coverage)
        run: npm run test:ci

      - name: Write coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            const lines = [
              '## Coverage Summary',
              '',
              '| Metric | Pct | Covered / Total |',
              '|---|---:|---:|',
              \`| Lines | \${t.lines.pct}% | \${t.lines.covered} / \${t.lines.total} |\`,
              \`| Statements | \${t.statements.pct}% | \${t.statements.covered} / \${t.statements.total} |\`,
              \`| Functions | \${t.functions.pct}% | \${t.functions.covered} / \${t.functions.total} |\`,
              \`| Branches | \${t.branches.pct}% | \${t.branches.covered} / \${t.branches.total} |\`,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
            "
          else
            echo 'coverage-summary.json not found' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          if-no-files-found: warn

      - name: Upload coverage summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-node-${{ matrix.node-version }}
          path: coverage/coverage-summary.json
          if-no-files-found: warn